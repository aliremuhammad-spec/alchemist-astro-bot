<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>الخيميائي · The Alchemist Astro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="sigil" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 3 L27 22 H5 Z"/><circle cx="16" cy="16" r="3.2"/></svg>
      <div>
        <h1 data-t="brand"></h1>
        <p class="beta" data-t="beta"></p>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" role="tablist">
    <button data-tab="chart" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg><span data-t="tab_chart"></span></button>
    <button data-tab="daily" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M12 3v3M4.9 6.9l2.1 2.1M3 15h3M18 15h3M17 9l2.1-2.1M4 20h16"/></svg><span data-t="tab_daily"></span></button>
    <button data-tab="channels" role="tab"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><span data-t="tab_channels"></span></button>
    <button data-tab="about" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-t="tab_about"></span></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v=1"></script>
</body>
</html>
